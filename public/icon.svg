<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18235C" />
      <stop offset="50%" stop-color="#101740" />
      <stop offset="100%" stop-color="#0A0E29" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer subtle tech ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#2563EB" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="16 12" />

  <!-- Central Emblem with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Main Stylized Geometric 'B' for B GROUP -->
    <path d="M 160 128 L 272 128 C 320 128 356 156 356 200 C 356 230 338 248 312 256 C 344 266 364 288 364 324 C 364 372 324 400 272 400 L 160 400 Z" fill="#FFFFFF" />
    
    <!-- Cutouts of B -->
    <path d="M 212 176 L 268 176 C 288 176 304 186 304 204 C 304 222 288 232 268 232 L 212 232 Z" fill="#18235C" />
    <path d="M 212 276 L 274 276 C 296 276 312 288 312 308 C 312 328 296 340 274 340 L 212 340 Z" fill="#18235C" />

    <!-- Human Silhouette / Human Capital Talent Emblem in Gold Accent (Gestión Humana) -->
    <!-- Head -->
    <circle cx="256" cy="256" r="28" fill="url(#goldGrad)" stroke="#18235C" stroke-width="4" />
    <!-- Heart / Talent Badge -->
    <circle cx="340" cy="164" r="14" fill="url(#goldGrad)" />
    <!-- Tech nodes connecting B Group -->
    <circle cx="160" cy="128" r="10" fill="url(#cyanGrad)" />
    <circle cx="160" cy="400" r="10" fill="url(#cyanGrad)" />
    <circle cx="364" cy="324" r="10" fill="url(#goldGrad)" />
  </g>

  <!-- Subtitle pill inside icon (for standalone PWA visibility) -->
  <rect x="180" y="424" width="152" height="28" rx="14" fill="url(#goldGrad)" />
  <text x="256" y="443" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#18235C" text-anchor="middle" letter-spacing="2">GESTIÓN HUMANA</text>
</svg>
