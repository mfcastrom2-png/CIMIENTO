<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>B GROUP INGENIERIA S.A.S. — Gestión Humana</title>
    <script type="text/javascript">
      // Redirección para Single Page Application (SPA) en GitHub Pages u hospedajes estáticos
      (function() {
        var pathSegments = window.location.pathname.split('/').filter(Boolean);
        // Si estamos en un repositorio de GitHub Pages (ej. /nombre-repo/...)
        var isGitHubPagesRepo = window.location.hostname.endsWith('github.io') && pathSegments.length > 0;
        var basePath = isGitHubPagesRepo ? '/' + pathSegments[0] + '/' : '/';
        
        // Redirigir al inicio del sistema conservando parámetros de consulta
        window.location.replace(window.location.origin + basePath + window.location.search + window.location.hash);
      })();
    </script>
  </head>
  <body style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #18235C; color: #FFFFFF;">
    <div style="text-align: center; padding: 24px;">
      <h2 style="font-size: 20px; font-weight: bold; margin-bottom: 8px;">Cargando B GROUP INGENIERIA S.A.S....</h2>
      <p style="font-size: 14px; color: #E2E8F0;">Redirigiendo a la aplicación principal.</p>
    </div>
  </body>
</html>
